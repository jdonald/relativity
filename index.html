<style>html{background:#14172b;overscroll-behavior:none}:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jersey+10&display=swap">
<style>
/* Layout: one phone screen stacked like a handheld console. Picture on top, Einstein's speech window, answer keys under the thumbs. */
:root{
  color-scheme:dark;
  --night:#14172b;   /* Bern at blue hour: page ground */
  --panel:#222747;   /* raised surfaces */
  --panel-2:#2f3564; /* keys */
  --line:#4a5190;    /* borders */
  --win-a:#2b3270;   /* speech window, top */
  --win-b:#1b2050;   /* speech window, bottom */
  --sand:#f3ead2;    /* sandstone cream: text */
  --dim:#aeb1d0;
  --red:#e2483f;     /* geranium / Swiss red: the one action colour */
  --red-d:#a12b28;
  --brass:#f5bd41;   /* clock-tower gold: numbers, stars */
  --aare:#43c5ae;    /* river turquoise: correct */
  --ink:#0b0d1a;
  --display:"Jersey 10","DotGothic16",ui-monospace,Menlo,Consolas,monospace;
  --body:"DotGothic16",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--sand);font-family:var(--body);font-size:16px;line-height:1.25;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:8px}

#hud{flex:0 0 36px;display:flex;align-items:center;gap:8px}
#hudTitle{flex:1;min-width:0;font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brass)}
.chip{font-family:var(--display);font-size:20px;line-height:1;letter-spacing:.03em;color:var(--sand);background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:6px 8px;min-height:36px;white-space:nowrap}
#bar{flex:0 0 4px;background:var(--panel);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s}

#stage{flex:0 0 auto;display:flex;justify-content:center}
#cv{display:block;max-width:100%;border:3px solid var(--ink);outline:2px solid var(--line);border-radius:4px;background:var(--ink)}

#talk{flex:1 1 100px;min-height:100px;max-height:230px;display:flex;gap:10px;align-items:flex-start;overflow:hidden;
  background:linear-gradient(var(--win-a),var(--win-b));border:3px solid var(--sand);border-radius:8px;box-shadow:inset 0 0 0 2px var(--ink);padding:10px 12px}
#face{flex:none;width:48px;height:39px;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;background:var(--line)}
#line{flex:1;min-width:0;margin:0;font-size:17px;line-height:22px;text-wrap:pretty}
#talk.cine #line{font-size:20px;line-height:27px}
#talk.tight #line{font-size:15px;line-height:18px}
#line .rest{visibility:hidden}

#ctl{flex:0 0 auto;margin-top:auto;display:flex;flex-direction:column;gap:8px}
#expr{font-family:var(--display);font-size:40px;line-height:1;min-height:70px;display:flex;align-items:center;justify-content:center;gap:.2em;white-space:nowrap;overflow:hidden;color:var(--sand)}
#expr span{display:inline-flex;align-items:center;gap:.16em}
#expr .w{font-size:.6em;color:var(--dim)}
#expr sup{align-self:center;font-size:.55em;margin-left:-.22em;line-height:1;transform:translateY(-.62em)}
.fr{display:inline-flex;flex-direction:column;align-items:center;gap:0;font-size:.7em;line-height:1}
#expr .fr{flex-direction:column;gap:0}
.fr b{font-weight:400;display:inline-flex;justify-content:center;min-width:1em;padding:0 .15em .05em;border-bottom:.09em solid currentColor}
.fr i{font-style:normal;display:inline-flex;justify-content:center;padding:.07em .15em 0}
.rt{align-items:stretch !important;gap:0 !important}
.rt svg{width:.42em;height:auto;flex:none;overflow:visible}
.rt>span{border-top:.08em solid currentColor;padding:.1em .12em 0 .05em}
.q{min-width:1.25em;height:1.2em;padding:0 .15em;justify-content:center;border:.08em solid var(--brass);border-radius:.12em;background:var(--ink);color:var(--brass)}
.q.empty{color:var(--line)}
.q.ok{border-color:var(--aare);color:var(--aare)}
.q.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

#pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{height:50px;padding:0;font-family:var(--display);font-size:32px;line-height:1;color:var(--sand);background:var(--panel-2);border:2px solid var(--line);border-bottom-width:5px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.key:active{transform:translateY(2px);border-bottom-width:3px}
.key.go{background:var(--red);border-color:var(--red-d);color:#fff}
.key svg{width:26px;height:20px}
.big{height:56px;width:100%;font-family:var(--display);font-size:30px;letter-spacing:.06em;line-height:1;color:#fff;background:var(--red);border:2px solid var(--red-d);border-bottom-width:6px;border-radius:8px}
.big:active{transform:translateY(2px);border-bottom-width:4px}
.big.alt{background:var(--panel-2);border-color:var(--line);color:var(--sand)}
#row{display:flex;gap:8px}
#row .big{font-size:26px;letter-spacing:.03em;white-space:nowrap;padding:0 4px}
#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sand);background:var(--panel-2);border:2px solid var(--line);border-bottom-width:5px;border-radius:8px;font-family:var(--display);font-size:34px}
.choice small{font-size:16px;line-height:1;color:var(--dim)}
.choice:disabled{opacity:.5}

#map{position:absolute;inset:0;z-index:5;background:var(--night);padding-inline:16px;padding-block:10px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
#map h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.05em;margin:0;color:var(--brass)}
#map h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:6px 0 0}
.lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{display:flex;align-items:center;gap:8px;text-align:left;min-height:58px;padding:8px;color:var(--sand);background:var(--panel);border:2px solid var(--line);border-radius:6px}
.lv b{flex:none;min-width:30px;text-align:center;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
.lv span{flex:1;min-width:0;font-size:14px;line-height:1.15}
.lv em{display:flex;gap:2px;margin-top:4px;font-style:normal;font-size:11px;color:var(--dim);height:12px}
.lv em svg{width:12px;height:12px}
.lv:disabled{opacity:.45}
.lv.on{border-color:var(--brass);background:var(--panel-2)}
.vlist{display:grid;gap:8px}
.vlist .lv b{font-size:22px;min-width:22px}
#map p{margin:0;font-size:14px;line-height:1.3;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.q.bad{animation:none}#bar i{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div id="hudTitle">Relativity</div>
    <button class="chip" id="btnSnd" type="button" aria-label="Sound on or off">Sound</button>
    <button class="chip" id="btnMap" type="button">Levels</button>
  </header>
  <div id="bar"><i></i></div>
  <div id="stage"><canvas id="cv" width="360" height="256" aria-label="Game picture"></canvas></div>
  <section id="talk" aria-live="polite">
    <img id="face" alt="Einstein" width="48" height="39">
    <p id="line"></p>
  </section>
  <section id="ctl">
    <div id="expr" hidden></div>
    <div id="pad" hidden>
      <button class="key" data-k="1" type="button">1</button><button class="key" data-k="2" type="button">2</button><button class="key" data-k="3" type="button">3</button><button class="key" data-k="4" type="button">4</button><button class="key" data-k="5" type="button">5</button>
      <button class="key" data-k="del" type="button" aria-label="Erase"><svg viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 2h15v16H9L2 10z"/><path d="M13 7l6 6M19 7l-6 6"/></svg></button>
      <button class="key" data-k="6" type="button">6</button><button class="key" data-k="7" type="button">7</button><button class="key" data-k="8" type="button">8</button><button class="key" data-k="9" type="button">9</button><button class="key" data-k="0" type="button">0</button>
      <button class="key go" data-k="go" type="button">GO</button>
    </div>
    <div id="choices" hidden></div>
    <button class="big" id="next" type="button" hidden>Next</button>
    <div id="row" hidden><button class="big" id="b1" type="button">Play</button><button class="big alt" id="b2" type="button">Levels</button></div>
  </section>
  <div id="map" hidden></div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=180,H=128,TAU=Math.PI*2;
let S=2,NOW=0;
const FD='"Jersey 10","DotGothic16",ui-monospace,Menlo,monospace',FB=FD;
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=u=>u*u*(3-2*u);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ================= drawing primitives (art units, 180 x 128) ================= */
function R(x,y,w,h,c){ctx.fillStyle=c;const a=Math.round(x*S),b=Math.round(y*S);ctx.fillRect(a,b,Math.max(1,Math.round((x+w)*S)-a),Math.max(1,Math.round((y+h)*S)-b))}
function font(size,f){ctx.font=Math.max(7,Math.round(size*S))+'px '+(f||FD)}
function T(s,x,y,size,c,al,f){font(size,f);ctx.fillStyle=c;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillText(s,x*S,y*S)}
function TS(s,x,y,size,c,al,f){T(s,x+1,y+1,size,'#0b0d1a',al,f);T(s,x,y,size,c,al,f)}
function TW(s,size,f){font(size,f);return ctx.measureText(s).width/S}
function C(cx,cy,r,c,sx){sx=sx||1;for(let dy=-r;dy<r;dy++){const yy=dy+.5,dx=Math.sqrt(r*r-yy*yy)*sx;R(cx-dx,cy+dy,dx*2,1,c)}}
function Ln(x0,y0,x1,y1,c,w){w=w||1;const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*1.3));for(let i=0;i<=n;i++){const u=i/n;R(x0+(x1-x0)*u-w/2,y0+(y1-y0)*u-w/2,w,w,c)}}
function Bx(x,y,w,h,c){R(x,y,w,1,c);R(x,y+h-1,w,1,c);R(x,y,1,h,c);R(x+w-1,y,1,h,c)}
function Ar(x,y,len,c){R(x,y,len,1,c);R(x+len-2,y-1,1,3,c);R(x+len-3,y-2,1,5,c)}
function F(n,d,x,y,size,c){n=String(n);d=String(d);T(n,x,y-size*.5,size,c);T(d,x,y+size*.55,size,c);const w=Math.max(TW(n,size),TW(d,size))+2;R(x-w/2,y-.5,w,1,c)}
function Rad(x,y,w,h,c){Ln(x,y+1,x+h*.12,y+h*.45,c);Ln(x+h*.12,y+h*.45,x+h*.32,y-h*.6,c);R(x+h*.32,y-h*.6-.5,w+3,1,c)}
function Rt(str,x,y,size,c){const w=TW(str,size);Rad(x-w/2-size*.42,y,w,size,c);T(str,x,y,size,c)}
function spr(map,pal,x,y,s){for(let r=0;r<map.length;r++){const row=map[r];let c=0;while(c<row.length){const ch=row[c];if(ch==='.'){c++;continue}let e=c+1;while(e<row.length&&row[e]===ch)e++;R(x+c*s,y+r*s,(e-c)*s,s,pal[ch]);c=e}}}

/* ================= sprites ================= */
const EIN=[
"...hh.hhhh.hh...",
".hhhhhhhhhhhhhh.",
"hhhhhhhhhhhhhhhh",
"hhhhssssssssHhhh",
"hhHssssssssssHhh",
"hhHsHHssssHHsHhh",
"hhHswesssswesHhh",
"hhHsssssSssssHh.",
".hHssssSSSsssH..",
"...smmmmmmmms...",
"...ssmmMMmmss...",
"....ssssssss....",
"....jwwsswwj....",
"..jjjjwttwjjjj..",
".jjjjjjwttwjjjj.",
".jjjjjjJwwJjjjj.",
".jjJjjjjJjjjJjj.",
".jjJjjjjojjjJjj.",
".jjJjjjjJjjjJjj.",
".jjJjjjjojjjJjj.",
".ssJjjjjJjjjJss.",
".ss.jjjjjjjj.ss.",
"....pppppppp....",
"....pppppppp....",
"....ppp..ppp....",
"....ppp..ppp....",
"....ppp..ppp....",
"....ppp..ppp....",
"...bbbb..bbbb..."];
const PE={h:'#f4f1ea',H:'#c4c2d0',s:'#f2bf96',S:'#d99d78',e:'#2a2333',w:'#ffffff',m:'#dcd9e4',M:'#8a6a66',j:'#7a5540',J:'#5b3d2e',t:'#b23a3a',p:'#3b3a52',b:'#1e1c2a',o:'#f5bd41'};
const STAR=["....y....","....y....","...yyy...","yyyyyyyyy",".yyyyyyy.","..yyyyy..","..yyyyy..",".yyy.yyy.",".y.....y."];
function einstein(x,y,s,talk,t){spr(EIN,PE,x,y,s);
  if(talk&&Math.floor(t*9)%2===0)R(x+6*s,y+10*s,4*s,1.5*s,'#3a2228');
  if(t%3.7<.13){R(x+4*s,y+6*s,2*s,s,PE.s);R(x+10*s,y+6*s,2*s,s,PE.s)}}

/* ================= particles ================= */
const parts=[],FW=['#f5bd41','#e2483f','#43c5ae','#7fd4ff','#ff8fa3','#f3ead2'];
function burst(x,y,n,sp){if(RM)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(sp||40)*(.35+Math.random()*.65);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:FW[i%FW.length]})}}
function drawParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.l-=dt*.9;if(p.l<=0){parts.splice(i,1);continue}const z=p.l>.5?2:1;R(p.x,p.y,z,z,p.c)}}

/* ================= scenes ================= */
function sky(cols,y0,y1){const h=(y1-y0)/cols.length;cols.forEach((c,i)=>R(0,y0+i*h,W,h+1,c))}
function stars(t,n,ymax,drift){for(let i=0;i<n;i++){let x=rnd(i)*W;if(drift)x=((x-t*(1+i%3)*drift)%W+W)%W;if(Math.sin(t*2+i*1.7)>-.7)R(x,rnd(i+50)*ymax,1,1,i%5===0?'#ffe9a8':i%7===0?'#9fd0ff':'#e8ecff')}}
function hills(base,amp,seed,c,snow){for(let x=0;x<W;x+=2){const h=Math.max(4,amp*(.55+.45*Math.sin(x*.06+seed)+.3*Math.sin(x*.17+seed*2.3)+.15*Math.sin(x*.41+seed*5)));R(x,base-h,2,h,c);if(snow&&h>amp*.8)R(x,base-h,2,Math.min(5,h-amp*.8+1),snow)}}
function peak(cx,base,h,c,c2,snow){for(let dy=0;dy<h;dy++){const half=dy*.72;R(cx-half,base-h+dy,half*2,1,c);R(cx+half*.25,base-h+dy,half*.75,1,c2);if(dy<h*.3){const j=dy%4<2?1:0;R(cx-half+j,base-h+dy,Math.max(1,half*2-j*2),1,snow)}}}
function house(x,y,w,h,c,n,i){R(x,y,w,h,c);R(x,y,1,h,'rgba(0,0,0,.18)');
  R(x-1,y-7,w+2,7,n?'#5a2f3a':'#9a4b36');R(x+1,y-9,w-2,2,n?'#4a2630':'#8a3f2d');R(x+Math.floor(w/2)-2,y-13,4,5,n?'#3a2030':'#7a3a2a');
  const step=(w-6)/3;
  for(let r=0;r<2;r++)for(let k=0;k<3;k++){const wx=x+3+k*step+1,wy=y+5+r*12,lit=n&&rnd(i*7+r*3+k)>.35;
    R(wx,wy,4,6,n?(lit?'#ffd97a':'#23264a'):'#3d5078');if(!n)R(wx,wy,4,1,'#f3ead2');
    if(r===0){R(wx-1,wy+6,6,1,'#3f8a4a');R(wx,wy+6,1,1,'#e2483f');R(wx+3,wy+6,1,1,'#e2483f')}}
  R(x+3,y+h-9,w-6,9,n?'#1a1830':'#3b2f3a');R(x+3,y+h-9,1,1,c);R(x+w-4,y+h-9,1,1,c)}
function tower(x,t,n){const st=n?'#62607f':'#cfc7a6',rf=n?'#4a2630':'#7b3b2e';
  R(x,30,24,62,st);R(x,30,2,62,'rgba(0,0,0,.18)');
  R(x-2,26,28,4,rf);R(x,20,24,6,rf);R(x+3,14,18,6,rf);R(x+6,8,12,6,rf);R(x+9,3,6,5,rf);R(x+11,-2,2,6,'#3f7a64');R(x+10,0,4,2,'#f5bd41');
  C(x+12,47,10,'#f5bd41');C(x+12,47,9,'#2a2440');
  for(let k=0;k<12;k++){const a=k/12*TAU;R(x+12+Math.sin(a)*7-.5,47-Math.cos(a)*7-.5,1,1,'#f5bd41')}
  const a=t*.9,b=t*.075;Ln(x+12,47,x+12+Math.sin(a)*6,47-Math.cos(a)*6,'#f5bd41');Ln(x+12,47,x+12+Math.sin(b)*4,47-Math.cos(b)*4,'#f3ead2');
  C(x+12,66,4,'#3a6ea8');R(x+11,65,2,2,'#f5bd41');
  R(x+7,76,10,16,'#2b2230');R(x+7,76,1,1,st);R(x+16,76,1,1,st)}
function tramCar(x,y,w,h){R(x,y,w,h,'#d4372f');R(x,y+h-6,w,2,'#f3e7c8');R(x+2,y-2,w-4,2,'#8f1f1c');
  const n=Math.max(1,Math.round(w/11)),ww=(w-4)/n;for(let i=0;i<n;i++)R(x+3+i*ww,y+3,Math.max(1,ww-2),h*.38,'#bfe6f5');
  R(x+w*.5-.5,y-7,1,5,'#3a3a4a');R(x+w*.5-4,y-8,8,1,'#3a3a4a');
  C(x+w*.2,y+h,2.5,'#22202c',w<40?w/40:1);C(x+w*.8,y+h,2.5,'#22202c',w<40?w/40:1)}
function swissFlag(x,y){R(x,y,1,14,'#5a5560');R(x+1,y,9,9,'#e2483f');R(x+4.5,y+1.5,2,6,'#fff');R(x+2.5,y+3.5,6,2,'#fff')}
function bern(t,o){o=o||{};const n=o.night;
  sky(n?['#141a3c','#1c2452','#2a2f66','#453a78','#6b4a80']:['#6fb7e6','#8cc8ec','#aad8f0','#cbe7f2','#f3e7c8'],0,72);
  if(n)stars(t,40,48);
  hills(72,30,1.3,n?'#39407a':'#b9cde6',n?'#8d93c9':'#ffffff');
  const cols=n?['#5a5878','#666486','#504e6e']:['#d8d0ac','#c9c39f','#e2dab8'];

let AC=null,gestured=false;
function ac(){if(save.muted||!gestured)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type,vol,when,slide){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);g.gain.setValueAtTime(vol||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}
function noise(d,vol){const a=ac();if(!a)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.value=vol||.25;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}
function mumble(ch){const a=ac();if(!a)return;try{const F={a:[730,1090],e:[530,1840],i:[300,2200],o:[570,840],u:[320,870],y:[300,2200]}[ch]||[500,1500];
  const t0=a.currentTime,d=.14,f0=112+Math.random()*30+(ch==='i'||ch==='e'?12:0),o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f0,t0);o.frequency.linearRampToValueAtTime(f0*(.9+Math.random()*.16),t0+d);
  lfo.frequency.value=9;lg.gain.value=6;lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.55,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  F.forEach((fq,i)=>{const b=a.createBiquadFilter(),bg=a.createGain();b.type='bandpass';b.frequency.value=fq;b.Q.value=6;bg.gain.value=i?.5:1;o.connect(b);b.connect(bg);bg.connect(g)});
  g.connect(a.destination);o.start(t0);lfo.start(t0);o.stop(t0+d+.03);lfo.stop(t0+d+.03)}catch(e){}}

function exprHTML(src){let i=0;

    o+='<span>'+ch+'</span>';i++}

function talking(){return !tw.done||vBusy()}
const DE_WORDS={ze:'the',zis:'this',zat:'that',zese:'these',zose:'those',zey:'they',zeir:'their',zere:'there',zem:'them',zen:'then',zink:'think',zing:'thing',zings:'things',zought:'thought',ve:'we',vy:'why',vat:'what',ven:'when',vere:'where',vich:'which',vith:'with',vill:'will',vas:'was',vant:'want',vait:'wait',vatch:'watch',vorks:'works',vork:'work',vay:'way',vays:'ways',avay:'away',vide:'wide',velcome:'welcome',backvards:'backwards',alvays:'always',varm:'warm',halfvay:'halfway'};
const EN_WORDS={ze:'zuh',zis:'ziss',zese:'zeez',zose:'zoze',zey:'zay',zeir:'zair',zere:'zair',zought:'zawt',vy:'vye',vas:'vuz',vait:'vate',vatch:'votch',vorks:'vurks',vork:'vurk',vere:'vair',avay:'a-vay',alvays:'all-vays',halfvay:'half-vay',ja:'yah',wunderbar:'voonderbar',nein:'nine',prima:'preema',richtig:'rish-tish',fantastisch:'fahn-tahs-tish',genau:'guh-now'};
function mapWords(str,map){return str.replace(/[A-Za-z]+/g,w=>{const r=map[w.toLowerCase()];return !r?w:w[0]===w[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r})}
function fracWords(n,d){n=+n;d=+d;const one=n===1;return d===2?(one?'one half':n+' halves'):d===4?(one?'one quarter':n+' quarters'):d===5?(one?'one fifth':n+' fifths'):n+' over '+d}
function sayText(txt,german){let o=txt.replace(/E\s*=\s*mc²/g,'E equals M C squared').replace(/\(\s*\)/g,' ').replace(/(\d+)\/(\d+)/g,(m,a,b)=>fracWords(a,b))
    .replace(/²/g,' squared').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/[()]/g,', ').replace(/\.\.\./g,', ')
    .replace(/\b[A-Z]{2,}\b/g,w=>w.toLowerCase());
  if(german)o=mapWords(o,DE_WORDS);
  else o=mapWords(o.replace(/1905/g,'nineteen oh five').replace(/Guten Tag/g,'Gooten tahg').replace(/Sehr gut/g,'Zair goot').replace(/mein Freund/g,'mine froynd').replace(/Auf Wiedersehen/g,'Owf veeder-zayn'),EN_WORDS);
  return o.replace(/\s+/g,' ').replace(/ ,/g,',').replace(/,(\s*,)+/g,',').replace(/[,:]\s*([.!?])/g,'$1').trim()}
function vFail(){V.broken=true;V.speaking=false;V.cur=null;try{SS.cancel()}catch(e){}}
function vStop(){V.seq++;V.speaking=false;V.cur=null;if(V.ok)try{SS.cancel()}catch(e){}}
function vSay(txt){if(!V.ok||V.broken||!gestured||!txt)return false;const o=vPick(),seq=++V.seq;
  try{const u=new SpeechSynthesisUtterance(sayText(txt,!!(o&&isDe(o.v))));
    if(o){u.voice=o.v;u.lang=o.v.lang}else u.lang='en-US';
    const gp=!!(o&&GPA.test(o.v.name)),man=!!(o&&MEN.test(o.v.name));u.rate=gp?.95:.88;u.pitch=gp?1:man?1.1:.6;u.volume=1;
    u.onstart=()=>{u._s=1;if(V.cur===u)V.ever=true};
    u.onend=u.onerror=()=>{if(V.cur!==u)return;V.speaking=false;V.cur=null;if(!u._s&&!V.ever)vFail()};
    const busy=SS.speaking||SS.pending;V.cur=u;V.speaking=true;V.until=performance.now()+3000+txt.length*130;
    const go=()=>{if(seq!==V.seq)return;try{SS.speak(u)}catch(e){vFail()}};
    if(busy){SS.cancel();setTimeout(go,90)}else go();
    if(!V.ever)setTimeout(()=>{if(!V.ever&&V.cur===u)vFail()},4000);
    return true}catch(e){vFail();return false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)vStop()});

function speak(text){tw.full=text||'';tw.t0=NOW;tw.n=-1;tw.done=RM||!tw.full;elTalk.classList.remove('tight');
  elLine.innerHTML='<span></span><span class="rest"></span>';elLine.lastChild.textContent=tw.full;
  if(elLine.scrollHeight>elTalk.clientHeight-14)elTalk.classList.add('tight');
  const eng=vEngine();tw.mode='blip';tw.cps=42;tw.lastMum=0;
  if(eng==='tts'&&vSay(tw.full)){tw.mode='tts';tw.cps=16}else{vStop();if(eng==='mumble'){tw.mode='mumble';tw.cps=24;tw.done=!tw.full}}
  if(tw.done)typeTo(tw.full.length)}
function typeTo(n){if(n===tw.n)return;tw.n=n;elLine.firstChild.textContent=tw.full.slice(0,n);elLine.lastChild.textContent=tw.full.slice(n)}
function tickType(){if(tw.done)return;const n=Math.min(tw.full.length,Math.floor((NOW-tw.t0)*tw.cps));
  if(n!==tw.n){if(tw.mode==='blip'){if(n%3===0)sfx.blip()}
    else if(tw.mode==='mumble'&&NOW-tw.lastMum>.085){const m=/[aeiouy]/i.exec(tw.full.slice(Math.max(0,tw.n),n));if(m){tw.lastMum=NOW;mumble(m[0].toLowerCase())}}
    typeTo(n)}
  if(n>=tw.full.length)tw.done=true}
function skipType(){tw.done=true;typeTo(tw.full.length)}

function hud(){$('hudTitle').textContent=cur.k<0?'Relativity':(cur.k+1)+'. '+LEVELS[cur.k].name;
  $('bar').firstElementChild.style.width=(cur.k<0?0:Math.round(100*cur.i/Math.max(1,cur.beats.length-1)))+'%';
  $('btnSnd').textContent=save.muted?'Muted':'Sound'}
function renderCtl(){const ty=beat.type,done=answered;
  elExpr.hidden=ty!=='ask';elPad.hidden=!(ty==='ask'&&!done);elCh.hidden=!(ty==='sim'&&!done);
  elNext.hidden=!(ty==='say'||ty==='show'||((ty==='ask'||ty==='sim')&&done));elRow.hidden=!(ty==='title'||ty==='win');
  elTalk.classList.toggle('cine',ty==='say'||ty==='title'||ty==='win');
  if(ty==='title'){const any=save.stars.some(s=>s>0);$('b1').textContent=any?'Continue':'Play';$('b2').textContent='Levels'}
  if(ty==='win'){$('b1').textContent=cur.k<LEVELS.length-1?'Next level':'Play again';$('b2').textContent='Levels'}
  hud()}
function setBeat(b){beat=b;beatTok++;beatT0=NOW;const pre=b.pre||{};hintAt=pre.hint?NOW:-1;solvedAt=pre.solved?NOW:-1;st.hint=hintAt>=0;st.solved=solvedAt>=0;st.th=st.hint?0:-1;st.ts=st.solved?0:-1;st.sim=null;simBusy=false;
  input='';answered=false;tries=0;qEl=null;parts.length=0;
  if(b.type==='ask'){elExpr.innerHTML=exprHTML(b.expr);qEl=elExpr.querySelector('.q')}
  if(b.type==='sim'){elCh.innerHTML=(b.opts||SPEEDS).map((s,i)=>'<button class="choice" type="button" data-i="'+i+'"><small>'+(b.opts?s.s:'speed')+'</small>'+(b.opts?'<span>'+s.b+'</span>':'<span class="fr"><b>'+s[0]+'</b><i>'+s[1]+'</i></span>')+'</button>').join('')}
  renderCtl();if(b.type==='ask')fitExpr();speak(b.text)}
function startLevel(k){cur={k,beats:LEVELS[k].beats(),i:0,stars:0};cur.beats.push({type:'win',text:'',draw:winPic});mistakes=0;$('map').hidden=true;setBeat(cur.beats[0])}
function showTitle(){cur={k:-1,beats:[],i:0,stars:0};$('map').hidden=true;setBeat({type:'title',text:'Guten Tag! Ready for an adventure vith light, clocks and rockets?',draw:titlePic})}
function advance(){if(cur.k<0)return;if(cur.i>=cur.beats.length-1)return;cur.i++;const b=cur.beats[cur.i];
  if(b.type==='win'){const s=mistakes<=1?3:mistakes<=4?2:1;cur.stars=s;save.stars[cur.k]=Math.max(save.stars[cur.k]||0,s);persist();
    const last=cur.k===LEVELS.length-1,total=save.stars.reduce((a,x)=>a+(x||0),0);
    b.text=last?'You are now a Junior Relativity Scientist! You have '+total+' of '+LEVELS.length*3+' stars.':'Wunderbar! Level complete. You earned '+s+(s===1?' star.':' stars.');
    sfx.win()}
  setBeat(b)}
function tapNext(){if(!beat)return;if(!tw.done){skipType();return}const ty=beat.type;if(ty==='say'||ty==='show'||((ty==='ask'||ty==='sim')&&answered)){sfx.tap();advance()}}
function solved(text){answered=true;solvedAt=NOW;st.solved=true;st.ts=0;sfx.ok();burst(90,18,26,44);renderCtl();speak(text)}
function submit(){if(!beat||beat.type!=='ask'||answered||input==='')return;
  if(parseInt(input,10)===beat.ans){if(qEl)qEl.classList.add('ok');solved(PRAISE[praiseI++%PRAISE.length]+(beat.after?' '+beat.after:''));
    if(!beat.after){const tok=beatTok,hold=(beat.draw.hold||2.2)*1000,go=()=>{if(tok!==beatTok)return;if(vBusy()||!tw.done){setTimeout(go,250);return}advance()};setTimeout(go,hold)}}
  else{tries++;mistakes++;sfx.no();input='';updateQ();if(qEl&&!RM){qEl.classList.remove('bad');void qEl.offsetWidth;qEl.classList.add('bad')}
    if(hintAt<0){hintAt=NOW;st.hint=true;st.th=0}
    speak(tries>=3?'Ze answer is '+beat.ans+'. Type it in!':(tries===1?'Not yet! ':'Try again! ')+(beat.hint||'Look at ze picture.'))}}
function key(k){if(!beat||beat.type!=='ask'||answered)return;if(k==='go'){submit();return}sfx.tap();if(k==='del')input=input.slice(0,-1);else if(input.length<3)input=(input==='0'?'':input)+k;updateQ()}
function choose(i){if(!beat||beat.type!=='sim'||answered||simBusy)return;simBusy=true;simAt=NOW;st.sim={choice:i,el:0};sfx.whoosh();
  elCh.querySelectorAll('button').forEach(b=>b.disabled=true);const tok=beatTok,pa=beat.popAt(i);
  if(pa>=0)setTimeout(()=>{if(tok===beatTok)sfx.boom()},pa*1000);
  setTimeout(()=>{if(tok!==beatTok)return;simBusy=false;
    if(i===beat.ok){solved(beat.after);const bp=beat.burst||[150,58];burst(bp[0],bp[1],40,50)}
    else{mistakes++;sfx.no();speak(beat.fail[i]);elCh.querySelectorAll('button').forEach(b=>b.disabled=false)}},beat.dur(i)*1000)}

/* ---- level map ---- */
const STARSVG=on=>'<svg viewBox="0 0 12 12"><path d="M6 0l1.8 4 4.2.4-3.2 2.9 1 4.3L6 9.4 2.2 11.6l1-4.3L0 4.4 4.2 4z" fill="'+(on?'var(--brass)':'var(--line)')+'"/></svg>';
function openMap(){vStop();let h='<div class="map-head"><h2>Levels</h2><button class="chip" type="button" data-a="close">Back</button></div>';
  CHAPTERS.forEach((cn,ci)=>{h+='<h3>'+cn+'</h3><div class="lv-grid">';LEVELS.forEach((L,k)=>{if(L.ch!==ci)return;const open=unlocked(k),s=save.stars[k]||0;
    h+='<button class="lv" type="button" data-k="'+k+'"'+(open?'':' disabled')+'><b>'+(k+1)+'</b><span>'+L.name+'<em>'+(open?STARSVG(s>0)+STARSVG(s>1)+STARSVG(s>2):'locked')+'</em></span></button>'});h+='</div>'});
  h+='<button class="chip" type="button" data-a="unlock">'+(save.all?'Lock levels again':'Grown-ups: unlock all levels')+'</button><button class="chip" type="button" data-a="title">Title screen</button>';
  const m=$('map');m.innerHTML=h;m.hidden=false}
/* ---- sound and voice panel ---- */
const escH=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const SAMPLE='Guten Tag! I am Albert Einstein. Ze speed of light is very fast, ja?';
function openSound(){vStop();if(V.ok)vLoad();const sel=save.voiceName||'',row=(id,name,sub)=>'<button class="lv'+(sel===id?' on':'')+'" type="button" data-v="'+escH(id)+'"><b>'+(sel===id?'●':'○')+'</b><span>'+escH(name)+'<em>'+sub+'</em></span></button>';
  let h='<div class="map-head"><h2>Sound</h2><button class="chip" type="button" data-a="close">Back</button></div><div class="lv-grid">'
    +'<button class="lv'+(save.muted?'':' on')+'" type="button" data-a="mute"><span>All sound<em>'+(save.muted?'off':'on')+'</em></span></button>'
    +'<button class="lv'+(save.voice?' on':'')+'" type="button" data-a="voice"><span>Einstein’s voice<em>'+(save.voice?'on':'off')+'</em></span></button></div>'
    +'<h3>Einstein’s voice. Tap one to hear it.</h3><div class="vlist">'+row('','Best guess',V.ok&&!V.broken&&V.list[0]?'now using '+escH(V.list[0].v.name):'an old-man voice, if this device has one');
  if(V.ok&&!V.broken)V.list.filter(o=>o.s>1).slice(0,14).forEach(o=>{h+=row(o.v.name,o.v.name,isDe(o.v)?'German voice, real accent':'English voice')});
  h+=row('~mumble','Grandpa mumble','no words, works on every device')+'</div>';
  if(!V.ok||V.broken)h+='<p>This device is not giving the game a speaking voice, so Einstein mumbles for now.</p>';
  else if(!V.list.length)h+='<p>Your device has not listed its voices yet. Close this and open it again in a moment.</p>';
  const m=$('map');m.innerHTML=h;m.hidden=false}
function sample(){if(vEngine()==='tts'&&vSay(SAMPLE))return;if(vEngine()==='mumble')'ua eiaoa aieia e eeo i i ei a a'.split('').forEach((c,i)=>{if(c!==' ')setTimeout(()=>mumble(c),i*95)})}
$('map').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sfx.tap();const a=b.dataset.a;
  if(b.dataset.k!==undefined)startLevel(+b.dataset.k);
  else if(b.dataset.v!==undefined){save.voiceName=b.dataset.v;save.voice=true;save.muted=false;if(b.dataset.v!=='~mumble'&&V.ok){V.broken=false;V.ever=false}persist();openSound();hud();sample()}
  else if(a==='close'){vStop();$('map').hidden=true}
  else if(a==='mute'){save.muted=!save.muted;persist();openSound();hud()}
  else if(a==='voice'){save.voice=!save.voice;persist();openSound();if(save.voice&&!save.muted)sample()}
  else if(a==='unlock'){save.all=!save.all;persist();openMap()}else if(a==='title')showTitle()});

/* ---- input wiring ---- */
document.addEventListener('pointerdown',()=>{gestured=true},{capture:true});
elPad.addEventListener('click',e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)});
elCh.addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(+b.dataset.i)});
elNext.addEventListener('click',tapNext);
$('stage').addEventListener('click',tapNext);elTalk.addEventListener('click',tapNext);
$('btnMap').addEventListener('click',()=>{sfx.tap();openMap()});
$('btnSnd').addEventListener('click',()=>{sfx.tap();openSound()});
$('b1').addEventListener('click',()=>{sfx.tap();if(beat.type==='title'){let k=LEVELS.findIndex((L,i)=>!(save.stars[i]>0));if(k<0){openMap();return}startLevel(k)}
  else if(cur.k<LEVELS.length-1)startLevel(cur.k+1);else showTitle()});
$('b2').addEventListener('click',()=>{sfx.tap();openMap()});
document.addEventListener('keydown',e=>{gestured=true;if(!$('map').hidden)return;
  if(/^[0-9]$/.test(e.key)){key(e.key);return}
  if(e.key==='Backspace'){key('del');e.preventDefault();return}
  if(e.key==='Enter'||e.key===' '){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();if(beat&&beat.type==='ask'&&!answered)submit();else tapNext()}});

/* ---- canvas sizing and the frame loop ---- */
function fit(){const app=$('app'),iw=app.clientWidth-32,ih=app.clientHeight-16,reserved=36+4+100+184+8*4+10;
  let w=Math.floor(Math.min(iw-6,528,(ih-reserved)*W/H));w=Math.max(180,w);const h=Math.round(w*H/W),dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);S=cv.width/W;if(beat&&beat.type==='ask')fitExpr()}
let lastMs=0;
function frame(ms){NOW=ms/1000;const dt=Math.min(.05,(ms-lastMs)/1000);lastMs=ms;
  if(beat){tickType();st.th=hintAt<0?-1:NOW-hintAt;st.ts=solvedAt<0?-1:NOW-solvedAt;if(st.sim)st.sim.el=NOW-simAt;
    ctx.globalAlpha=1;try{beat.draw(NOW-beatT0,st)}catch(err){if(!frame.err){frame.err=1;console.error(err)}}
    drawParts(dt)}
  requestAnimationFrame(frame)}

/* ---- boot ---- */
(function avatar(){try{const c=document.createElement('canvas');c.width=16;c.height=13;const x=c.getContext('2d');x.fillStyle='#3d4690';x.fillRect(0,0,16,13);
  for(let r=0;r<13;r++)for(let k=0;k<16;k++){const ch=EIN[r][k];if(ch!=='.'){x.fillStyle=PE[ch];x.fillRect(k,r,1,1)}}$('face').src=c.toDataURL()}catch(e){}})();
function start(data){NOW=performance.now()/1000;fit();
  if(data&&typeof data.k==='number'&&data.k>=0&&data.k<LEVELS.length){startLevel(data.k);mistakes=data.m||0;const i=Math.min(data.i||0,cur.beats.length-2);if(i>0){cur.i=i;setBeat(cur.beats[i])}}
  else showTitle();
  requestAnimationFrame(frame)}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(beat&&beat.type==='ask')fitExpr()}).catch(()=>{});
try{const hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot)hot.snapshot(()=>({k:cur.k,i:cur.i,m:mistakes}));
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{})}catch(e){start({})}
window.__rel={get beat(){return beat},get cur(){return cur},get answered(){return answered},get typing(){return !tw.done},get voice(){return {engine:vEngine(),broken:V.broken,pick:(vPick()||{v:{}}).v.name}},key,choose,tapNext,startLevel,sayText,LEVELS};
})();
</script>

if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
